# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# The MDK also enables org.gradle.configuration-cache, but this is a multi loader build and
# Fabric Loom 1.9 is not configuration cache compatible. The setting applies to the whole
# build, so enabling it here would break the fabric module.

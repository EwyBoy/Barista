plugins {
    // Fabric's own 26.2 template pins a Loom snapshot: no stable Loom release yet supports
    // building against an unobfuscated Minecraft without a mappings dependency.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id 'maven-publish'
}

// Mojang ships Java 25 to end users in 26.2, so mods must target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base {
    archivesName = project.MOD_NAME
}
version = project.MC_VERSION_GENERAL + "-" + project.VERSION + "-" + project.MOD_LOADER
group = project.MAVEN_GROUP

repositories {
    // Loom adds the Minecraft and Fabric repositories itself. Nothing else is needed now that
    // the unused ModMenu and Cloth Config dependencies are gone.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.MC_VERSION}"
    // No mappings declaration: Minecraft 26.2 ships deobfuscated, Mojang no longer publishes
    // client_mappings, and Loom no longer expects a mappings dependency.

    implementation "net.fabricmc:fabric-loader:${project.LOADER_VERSION}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.FABRIC_VERSION}"

    includeFabricApiModule "fabric-key-mapping-api-v1"
    includeFabricApiModule "fabric-lifecycle-events-v1"
}

def includeFabricApiModule(String moduleName) {
    Object dependency = fabricApi.module(moduleName, project.FABRIC_VERSION)
    dependencies.implementation(dependency)
    dependencies.include(dependency)
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {

    it.options.encoding = "UTF-8"
    def targetVersion = 25

    if (JavaVersion.current().isJava9Compatible()) {
        it.options.release = targetVersion
    }
}

java {
    withSourcesJar()
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/barista.accesswidener")
}

task curseforge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    if (project.hasProperty('CF_API_KEY')){
        apiToken = project.getProperty('CF_API_KEY')
    }

    // On 26.2 this is `jar`, not `remapJar`. Minecraft ships deobfuscated so Loom performs no
    // remap step and no longer registers a remapJar task at all; `jar` is the production artifact.
    // Note this is the opposite of the 1.21.1 branch, where uploading `jar` would ship a dev jar.
    def mainFile = upload(project.PROJECT_ID, jar)
    mainFile.releaseType = "${RELEASE_TYPE}"
    mainFile.addModLoader "${MOD_LOADER}"
    mainFile.addGameVersion "${MC_VERSION}"
    mainFile.addJavaVersion "${JAVA_VERSION}"
    mainFile.addEnvironment('Client', 'Server')

    mainFile.changelog = file("$project.rootDir/CHANGELOG.md")
    mainFile.changelogType = 'markdown'

    mainFile.displayName = "${MOD_NAME}-${MC_VERSION_GENERAL}-${VERSION}-${MOD_LOADER}.jar"
}